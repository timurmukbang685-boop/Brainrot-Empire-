
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainrot Empire</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:white;font-family:Arial;padding:20px}
header{text-align:center;padding:20px}
h1{color:#b58cff}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;max-width:850px;margin:20px auto}
.card,.panel{background:#202036;border:1px solid #393953;border-radius:15px;padding:15px;text-align:center}
.price{color:#ffd45c;font-weight:bold;margin:12px}
button{background:#8d55ed;color:white;border:0;border-radius:9px;padding:12px;font-weight:bold;cursor:pointer;width:100%;margin:4px 0}
input{width:100%;padding:13px;border-radius:8px;background:#111;color:white;margin:12px 0}
.panel{display:none;max-width:500px;margin:25px auto}
.nick{font-size:24px;color:#65e6a0;font-weight:bold}
.timer{font-size:38px;color:#ffd45c;margin:18px}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>
<h1>👑 BRAINROT EMPIRE</h1>
<p>Пополняй баланс через трейд Roblox!</p>
</header>
<h2 style="text-align:center">🛒 Каталог пополнения</h2>
<div class="catalog" id="catalog"></div>
<div class="panel" id="panel">
<h2 id="selected"></h2>
<p id="coins"></p>
<p>Отправь трейд игроку:</p>
<div class="nick">Timurrrrrr125</div>
<button onclick="copyNick()">📋 Скопировать ник</button>
<p class="small">Добавлять в друзья не нужно!</p>
<input id="player" placeholder="Твой Roblox-ник">
<button id="start" onclick="startTimer()">Начать пополнение</button>
<div id="active" style="display:none">
<div class="timer" id="timer">05:00</div>
<p>У тебя есть 5 минут на отправку трейда.</p>
<button onclick="sentTrade()">Я отправил трейд</button>
</div>
<p id="message"></p>
</div>
<script>
const items=[
["Cash or Card",45],
["Garama and Madundung",50],
["Fragola la la la",75],
["Capitano Moby",100],
["Celestial Pegasus",110],
["Rosey and Teddy",500],
["Bumbutron",600],
["Dragon Caneloni",975]
];
let chosen=null,interval=null,endTime=0;
const catalog=document.getElementById("catalog");
items.forEach(item=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`<h3>${item[0]}</h3><div class="price">🪙 ${item[1]} монет</div><button>Пополнить</button>`;
card.querySelector("button").onclick=()=>selectItem(item);
catalog.appendChild(card);
});
function selectItem(item){
chosen=item;
document.getElementById("panel").style.display="block";
document.getElementById("selected").textContent=item[0];
document.getElementById("coins").textContent="Ты получишь: "+item[1]+" монет";
document.getElementById("active").style.display="none";
document.getElementById("start").style.display="block";
document.getElementById("message").textContent="";
clearInterval(interval);
document.getElementById("panel").scrollIntoView({behavior:"smooth"});
}
function copyNick(){
if(navigator.clipboard){
navigator.clipboard.writeText("Timurrrrrr125").then(()=>alert("Ник скопирован!"));
}else{alert("Твой Roblox-ник: Timurrrrrr125");}
}

function startTimer(){
const player=document.getElementById("player").value.trim();

if(!player){
alert("Сначала введи свой Roblox-ник!");
return;
}

if(!chosen)return;

endTime=Date.now()+5*60*1000;

document.getElementById("active").style.display="block";
document.getElementById("start").style.display="none";
document.getElementById("message").textContent="";

updateTimer();
interval=setInterval(updateTimer,1000);
}

function updateTimer(){
const remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
const minutes=Math.floor(remaining/60);
const seconds=remaining%60;

document.getElementById("timer").textContent=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(remaining<=0){
clearInterval(interval);
document.getElementById("active").style.display="none";
document.getElementById("start").style.display="block";
document.getElementById("message").textContent=
"Время истекло! Создай новую заявку.";
}
}

function sentTrade(){
if(Date.now()>=endTime){
updateTimer();
return;
}

clearInterval(interval);
document.getElementById("active").style.display="none";
document.getElementById("message").textContent=
"Заявка отправлена! Ожидай проверки администратора.";
}
</script>
</body>
</html>
